[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dloop"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
description = "DLoop: Looped Speculative Decoding (training built on SpecForge)"
urls = {Homepage = "https://github.com/naver-ai/DLoop"}
dependencies = [
    "torch>=2.8",
    "transformers>=5.8.1",
    "datasets",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "tqdm",
    "numpy",
    "pydantic",
    "packaging",
    "yunchang",
    "tensorboard",
    "openai",
]

[tool.setuptools.packages.find]
include = ["specforge*"]

[project.optional-dependencies]
# MTP hosts (Qwen3.5 built-in MTP head, Gemma 4 assistant)
mtp = ["transformers>=5.16", "flash-linear-attention>=0.5.2"]
# --target-model-backend sglang and the data regeneration server
sglang = ["sglang==0.5.14"]
wandb = ["wandb"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
